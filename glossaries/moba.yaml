title: MOBA 游戏
description: 英雄联盟、DOTA、王者荣耀这类团队竞技游戏的黑话
terms:
  - word: gank
    meaning: 偷袭围杀，绕后或从侧翼突然袭击对方
  - word: ks
    meaning: 抢人头，把队友快拿到的击杀抢走（kill steal）
  - word: imba
    meaning: 不平衡、强得过分（imbalanced）
  - word: carry
    meaning: 核心输出位，靠个人发育带队赢
  - word: farm
    meaning: 打钱发育，刷兵或野怪攒装备
  - word: jungle
    meaning: 野区，也指打野位
  - word: roam
    meaning: 游走支援，离开自己的线去帮别的路
  - word: poke
    meaning: 远程消耗，隔着距离磨对方血量
  - word: cc
    meaning: 控制技能，眩晕减速这类让人动不了的技能（crowd control）
  - word: tp
    meaning: 传送（teleport）
  - word: recall
    meaning: 回城补给
  - word: buff
    meaning: 增益，给数值或状态加强
  - word: nerf
    meaning: 削弱，把数值或效果砍弱
  - word: feed
    meaning: 送人头，不断给对面送击杀
  - word: troll
    meaning: 故意捣乱、不好好玩
  - word: smurf
    meaning: 小号炸鱼，高手开低分段账号虐菜
  - word: 补刀
    meaning: 收掉小兵最后一下，拿到赏金
  - word: 开黑
    meaning: 组队一起玩
  - word: 炸线
    meaning: 线上被打崩，经济经验全面落后
  - word: 打团
    meaning: 双方集中起来打大规模团战
  - word: 五杀
    meaning: 一个人连续击杀对方五名英雄（penta kill）
