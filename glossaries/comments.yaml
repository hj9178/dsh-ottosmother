title: 评论与弹幕
description: 直播、视频、评论区里常见的夸赞、嘲讽和情绪表达
terms:
  - word: GG
    meaning: 打得好、游戏结束（good game），也用来表示认输或收场
  - word: WP
    meaning: 打得好（well played）
  - word: EZ
    meaning: 轻松拿下（easy），常带炫耀或挑衅
  - word: 下饭
    meaning: 操作差、让人看了想骂，像菜到能就着吃米饭
  - word: '666'
    meaning: 夸人太强了，也常被用来反讽
  - word: '233'
    meaning: 笑，大笑
  - word: 典
    meaning: 经典、老套，通常带嘲讽
  - word: 绷不住了
    meaning: 忍不住笑，或情绪没兜住
  - word: 蚌埠住了
    meaning: 「绷不住了」的谐音梗，忍不住笑
  - word: 破防
    meaning: 被戳中痛点，情绪崩了
  - word: 寄
    meaning: 完蛋了、没救了
  - word: 润
    meaning: 跑路，去别的地方发展
  - word: 麻了
    meaning: 无语、麻木了
  - word: 草
    meaning: 卧槽的委婉写法，表示惊讶或无语
  - word: 好活
    meaning: 干得漂亮，通常带调侃
  - word: 绝活
    meaning: 厉害的操作或整活
  - word: 摆烂
    meaning: 破罐子破摔，不想努力了
  - word: 开摆
    meaning: 开始摆烂
  - word: yyds
    meaning: 永远的神，夸人非常厉害
  - word: awsl
    meaning: 啊我死了，表示太可爱或太激动
  - word: 栓Q
    meaning: 谢谢（thank you 谐音），常带无奈或反讽
  - word: 前方高能
    meaning: 提醒接下来有冲击性内容
  - word: 名场面
    meaning: 值得反复回看的经典画面
  - word: 火钳刘明
    meaning: 火前留名，趁帖子还没火先占个楼
