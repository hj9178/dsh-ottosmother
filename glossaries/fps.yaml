title: FPS 游戏
description: CS、瓦罗兰特、Apex、彩虹六号这类射击游戏的黑话
terms:
  - word: eco
    meaning: 经济局，钱少不乱买，攒钱等下一局
  - word: save
    meaning: 保枪保经济，这局不拼，把钱留到下一局
  - word: peek
    meaning: 探头对枪，卡着掩体边沿出去看/射击
  - word: prefire
    meaning: 预瞄开枪，提前把准星架在对方会出现的点位上
  - word: spray
    meaning: 扫射，按住扳机连续开枪
  - word: recoil
    meaning: 后坐力
  - word: rush
    meaning: 快攻冲点，不磨蹭直接压上去
  - word: camp
    meaning: 蹲点守株待兔
  - word: smurf
    meaning: 小号炸鱼，高手开低分段账号虐菜
  - word: wallbang
    meaning: 穿墙击杀
  - word: quickscope
    meaning: 瞬狙，开镜瞬间开枪
  - word: ADS
    meaning: 开镜瞄准（aim down sights）
  - word: TTK
    meaning: 击杀所需时间（time to kill），越短越强
  - word: clutch
    meaning: 残局翻盘，一个人力挽狂澜
  - word: ace
    meaning: 团灭对方全队
  - word: frag
    meaning: 击杀数
  - word: hitreg
    meaning: 命中判定，打中了游戏算不算数
  - word: spawn
    meaning: 出生点
  - word: 架枪
    meaning: 守在关键位置等对面过来
  - word: 拉枪线
    meaning: 准星横移瞄准移动中的目标
  - word: 爆头
    meaning: 打中头部，伤害更高
