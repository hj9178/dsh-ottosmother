# 把本包插入 profile 的 cordis 插件树。
# id / name 必须与 package.json 的 name 一致，inject 与 lib/index.js 的 inject 对应。
- insert:
    - id: dsh-ottosmother
      name: 'dsh-ottosmother'
      inject: [systemPrompt]
      config:
        enabled: true
        # 提醒强度：quiet | normal | strong
        reminder: normal
        # 自定义词表路径（YAML）；留空使用包内 glossary.yml。
        glossary: ''
